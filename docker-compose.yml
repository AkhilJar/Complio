services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      #expose db to your mac for inspection, e.g. a db client
      - "5432:5432"
    volumes:
      #named volume so data survives `docker compose down`
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      #compose waits for this before starting the api
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      #note the host is `db`, not localhost — it's the service name above
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        #don't start api until postgres is actually accepting connections
        condition: service_healthy

volumes:
  pgdata:
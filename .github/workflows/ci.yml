name: CI

#run on every push and PR
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      #pull the repo onto the runner
      - uses: actions/checkout@v5

      #build the backend image
      - name: Build image
        run: docker build -t complio-api ./backend

      #start the container in the background. the settings in config.py are
      #required, so the app refuses to boot without them — these are throwaway
      #values that only satisfy validation. /health touches neither postgres
      #nor minio, so nothing has to be reachable for the smoke test
      - name: Run container
        run: |
          docker run -d -p 8000:8000 \
            -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            -e MINIO_ENDPOINT=http://localhost:9000 \
            -e MINIO_ACCESS_KEY=ci \
            -e MINIO_SECRET_KEY=ci-secret \
            -e MINIO_BUCKET=ci-bucket \
            complio-api

      #give uvicorn a second to boot
      - name: Wait for startup
        run: sleep 3

      #fail the build if /health doesn't return 200
      - name: Health check
        run: curl --fail localhost:8000/health
